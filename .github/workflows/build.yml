# Builds and tests arcOS on every push and pull request; the live CD and the
# disk image are kept as the run's artifacts for a week.
name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update
          # musl and MinGW build the Linux and Windows programs of test-compat.
          sudo apt-get install -y nasm qemu-system-x86 musl-tools gcc-mingw-w64-x86-64
          # rust-toolchain.toml picks the toolchain, targets and rust-src.
          rustup show

      - name: Unit tests
        run: make check

      - name: Build
        run: make image iso

      - name: Test in QEMU
        run: |
          make test
          make test-compat

      - uses: actions/upload-artifact@v4
        with:
          name: arcos
          path: |
            build/arcos.iso
            build/arcos.img
          retention-days: 7
