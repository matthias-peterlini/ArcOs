[workspace]
resolver = "2"
members = ["kernel", "libs/*", "drivers/*", "apps/*", "store/*"]

[workspace.package]
version = "0.5.0"
edition = "2021"
publish = false
authors = ["Matthias Peterlini"]

[workspace.dependencies]
arcc-core = { path = "libs/arcc-core" }
arc-vm = { path = "libs/arc-vm" }
arcdk = { path = "libs/arcdk" }
arcfs = { path = "libs/arcfs" }
arcgfx = { path = "libs/arcgfx" }
arctls = { path = "libs/arctls" }
arczip = { path = "libs/arczip" }
arcjson = { path = "libs/arcjson" }
arcweb = { path = "libs/arcweb" }
arcui = { path = "libs/arcui" }
arcdrv = { path = "libs/arcdrv" }
arcrt = { path = "libs/arcrt" }
arcusb = { path = "libs/arcusb" }
arcvirtio = { path = "libs/arcvirtio" }

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 2
debug = false
codegen-units = 1
